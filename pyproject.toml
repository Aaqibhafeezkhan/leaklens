[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens"
version = "0.3.0"
description = "Audit datasets and ML pipelines for data leakage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
arena = ["mlflow>=2.9"]
app = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "streamlit>=1.30"]
dev = ["pytest>=7", "mlflow>=2.9", "fastapi>=0.110", "httpx>=0.26", "python-multipart>=0.0.9"]

[project.scripts]
leaklens = "leaklens.cli:main"

[tool.setuptools.packages.find]
include = ["leaklens*"]