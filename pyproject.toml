[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens"
version = "0.2.0"
description = "Audit datasets and ML pipelines for data leakage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
arena = ["mlflow>=2.9"]
dev = ["pytest>=7", "mlflow>=2.9"]

[project.scripts]
leaklens = "leaklens.cli:main"

[tool.setuptools.packages.find]
include = ["leaklens*"]